<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR LOCATION SYSTEM</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#edf3ff;font-family:system-ui,sans-serif}header{background:#182e52;padding:12px 15px;line-height:1.8}header strong{font-size:18px}.sub{color:#b6d4ff;font-size:13px}#map{height:43vh;min-height:270px}.panel{background:#28509b;border:6px solid #a6c5f4;margin:8px;padding:10px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.grid button,.actions button{min-height:63px;border:4px solid #9fb4cb;background:#eaf0f5;color:#263c58;font-size:clamp(12px,2.8vw,17px);cursor:pointer}.grid button.active{background:#ffdb7b}.grid button.alert.active{background:#c93434;color:white}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions button{min-height:49px}.actions .primary{background:#ffdb7b}input{padding:11px;width:100%;border:0;border-radius:4px;font-size:15px}.line{display:flex;gap:8px;margin:8px 0}.line button{padding:10px;background:#dce9fb;border:0;white-space:nowrap}.note{font-size:12px;color:#b9c9e2;line-height:1.5}.status{font-weight:bold;color:#ffe18d}.users{font-size:13px;line-height:1.8}label{font-size:13px} @media (orientation:landscape){#map{height:40vh;min-height:180px}.grid button{min-height:45px}}</style></head><body><header><strong>CAR LOCATION SYSTEM 民間用・共有版</strong><div id="clock"></div><div>自車活動：<span id="activity" class="status">待機</span>　速度：<span id="speed">--</span> km/h　方位：<span id="heading">--</span>°</div><div class="sub" id="gps">GPS：未開始</div><div class="sub" id="sync">共有：未設定</div></header><div id="map"></div><section class="panel"><div class="grid" id="statusButtons"></div></section><section class="panel"><div class="actions"><button id="start" class="primary">GPS共有開始</button><button id="stop">共有停止</button><button id="center">現在地</button><button id="copy">共有URLコピー</button></div><div class="line"><input id="room" placeholder="共有ルームID（新規なら自動生成）"><button id="join">ルームに参加</button></div><div class="line"><input id="displayName" placeholder="表示名（例：車両01）" maxlength="25"><button id="saveName">名前保存</button></div><label><input id="showAll" type="checkbox" checked style="width:auto"> 参加端末を地図に表示</label><div id="users" class="users"></div><p class="note">共有は本人が開始したときのみ有効です。共有URLを知る人は位置情報を閲覧できます。URLは信頼できる相手にのみ渡してください。画面を閉じるとGPS送信は停止します。ブラウザのバックグラウンド動作は保証されません。</p><p class="note">Firebase接続設定済み。運用前に付属の database.rules.json の内容をRealtime Databaseの「ルール」に適用してください。共有URLは秘密の合言葉と同様に扱い、第三者への転送に注意してください。</p></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,set,onValue,remove,onDisconnect,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyBS8Jcoi1aCiCSDprM3WbaMa7GHqdqUhdg',authDomain:'carlocation-738cf.firebaseapp.com',databaseURL:'https://carlocation-738cf-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'carlocation-738cf',storageBucket:'carlocation-738cf.firebasestorage.app',messagingSenderId:'751242716307',appId:'1:751242716307:web:ab0fff24c6a9d27dd11966'};
const $=id=>document.getElementById(id), statuses=['業務','配達','移動','送迎','待機','休憩','その他','故障','事故','緊急'];let activity='待機',watch=null,room='',uid='',db=null,unsub=null,position=null,lastUpload=0,ownMarker=null;const markers=new Map();const map=L.map('map').setView([36.56,136.65],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);setInterval(()=>$('clock').textContent=new Date().toLocaleString('ja-JP'),1000);
function msg(s){$('sync').textContent='共有：'+s}function setActivity(s){activity=s;lastUpload=0;$('activity').textContent=s;document.querySelectorAll('[data-status]').forEach(b=>b.classList.toggle('active',b.dataset.status===s));publish()};statuses.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.dataset.status=s;if(['故障','事故','緊急'].includes(s))b.className='alert';b.onclick=()=>setActivity(s);$('statusButtons').appendChild(b)});setActivity('待機');
let appReady=false;try{if(firebaseConfig.apiKey==='REPLACE_ME')throw Error('Firebase未設定');const app=initializeApp(firebaseConfig);db=getDatabase(app);const credential=await signInAnonymously(getAuth(app));uid=credential.user.uid;appReady=true;msg('接続準備完了')}catch(e){msg('Firebase設定が必要：'+e.message)}
function cleanRoom(s){return /^[a-zA-Z0-9_-]{24,80}$/.test(s)?s:null}function newRoom(){const a=new Uint8Array(24);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')};function name(){return $('displayName').value.trim()||'車両-'+uid.slice(0,5)};function path(){return ref(db,`rooms/${room}/members/${uid}`)};
async function join(r){if(!appReady)return alert('Firebaseの設定を完了してください');if(!cleanRoom(r))return alert('共有ルームIDが不正です');if(watch!==null)await stop();if(unsub)unsub();for(const m of markers.values())map.removeLayer(m);markers.clear();room=r;$('room').value=r;history.replaceState(null,'','#room='+encodeURIComponent(room));unsub=onValue(ref(db,`rooms/${room}/members`),snap=>{const data=snap.val()||{};$('users').textContent='';const now=Date.now();Object.entries(data).forEach(([id,u])=>{if(typeof u.lat!=='number'||typeof u.lng!=='number')return;const age=now-(u.updatedAt||0);const stale=age>120000;const label=`${u.name||'車両'}｜${u.activity||'不明'}｜${stale?'更新停止':'更新中'}｜${u.speed??'--'} km/h`;const p=[u.lat,u.lng];if(!markers.has(id))markers.set(id,L.marker(p).addTo(map));const marker=markers.get(id);marker.setLatLng(p).bindPopup(label);if(!$('showAll').checked&&id!==uid)map.removeLayer(marker);else marker.addTo(map);const div=document.createElement('div');div.textContent=label;$('users').appendChild(div)});for(const [id,m] of markers)if(!data[id]){map.removeLayer(m);markers.delete(id)};msg(`ルーム参加中・${Object.keys(data).length}台の記録`)});msg('ルームに参加しました')}
async function publish(){if(!appReady||!room||watch===null||!position)return;const now=Date.now();if(now-lastUpload<2500)return;lastUpload=now;try{await set(path(),{name:name(),activity,lat:position.coords.latitude,lng:position.coords.longitude,speed:position.coords.speed==null?null:Math.round(position.coords.speed*3.6),heading:position.coords.heading==null?null:Math.round(position.coords.heading),updatedAt:serverTimestamp()})}catch(e){msg('送信エラー：'+e.message)}}
$('join').onclick=()=>join($('room').value.trim());$('start').onclick=async()=>{if(!appReady)return alert('Firebase設定が必要です');if(!room)await join(newRoom());if(!navigator.geolocation)return alert('GPS非対応です');if(watch!==null)return;try{await onDisconnect(path()).remove();watch=navigator.geolocation.watchPosition(p=>{position=p;$('gps').textContent=`GPS：測位成功 緯度${p.coords.latitude.toFixed(5)} 経度${p.coords.longitude.toFixed(5)}`;$('speed').textContent=p.coords.speed==null?'--':Math.round(p.coords.speed*3.6);$('heading').textContent=p.coords.heading==null?'--':Math.round(p.coords.heading);if(!ownMarker){ownMarker=L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:9,color:'#205bce'}).addTo(map);map.setView(ownMarker.getLatLng(),16)}else ownMarker.setLatLng([p.coords.latitude,p.coords.longitude]);publish()},e=>$('gps').textContent='GPSエラー：'+e.message,{enableHighAccuracy:true,maximumAge:1000,timeout:20000});msg('GPS測位開始')}catch(e){msg('開始失敗：'+e.message)}};
async function stop(){if(db&&room&&uid)try{await onDisconnect(path()).cancel()}catch(e){}if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}position=null;if(db&&room&&uid)try{await remove(path())}catch(e){msg('停止時の削除に失敗：'+e.message)}$('gps').textContent='GPS：停止';msg('送信停止')};$('stop').onclick=stop;$('center').onclick=()=>{if(ownMarker)map.setView(ownMarker.getLatLng(),16)};$('copy').onclick=async()=>{if(!room&&appReady)await join(newRoom());if(!room)return alert('共有ルームを作成してください');try{await navigator.clipboard.writeText(location.href);alert('共有URLをコピーしました')}catch(e){prompt('共有URL',location.href)}};$('saveName').onclick=()=>{lastUpload=0;publish()};$('showAll').onchange=()=>{for(const [id,m] of markers){if($('showAll').checked||id===uid)m.addTo(map);else map.removeLayer(m)}};const initial=location.hash.replace(/^#room=/,'');if(cleanRoom(initial)&&appReady)join(initial);window.addEventListener('pagehide',()=>{if(watch!==null)navigator.geolocation.clearWatch(watch)});
</script></body></html>
